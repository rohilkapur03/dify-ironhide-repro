# Set IRONHIDE_CLI_SHA256 from the approved v2.4.1 release digest.
name: Ironhide

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: ironhide/referee
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "openai==2.28.0"
      - uses: actions/cache/restore@v4
        with:
          path: .ironhide
          key: ironhide-baseline-main-${{ github.run_id }}
          restore-keys: |
            ironhide-baseline-main-
      - uses: ironhide-ai/ironhide-scan@v2.4.1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini-2025-04-14
        with:
          api_key: ${{ secrets.IRONHIDE_API_KEY }}
          agent_id: agt_71bd63
          adapter: ironhide_openai_adapter:agent
          cli_sha256: ${{ vars.IRONHIDE_CLI_SHA256 }}
          advisory_mode: "false"
          block_on: critical,high
          profile: pr
          runs: 1

  monitor:
    name: ironhide/monitor
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "openai==2.28.0"
      - uses: actions/cache@v4
        with:
          path: .ironhide
          key: ironhide-baseline-main-${{ github.run_id }}
          restore-keys: |
            ironhide-baseline-main-
      - uses: ironhide-ai/ironhide-scan@v2.4.1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini-2025-04-14
        with:
          api_key: ${{ secrets.IRONHIDE_API_KEY }}
          agent_id: agt_71bd63
          adapter: ironhide_openai_adapter:agent
          cli_sha256: ${{ vars.IRONHIDE_CLI_SHA256 }}
          advisory_mode: "true"
          comment: "false"
          profile: pr
          runs: 1
