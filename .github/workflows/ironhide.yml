# Set IRONHIDE_CLI_SHA256 from the approved v2.4.1 release digest.
name: Ironhide

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: ironhide/referee
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "openai==2.28.0"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ironhide
          key: ironhide-baseline-main-${{ github.run_id }}
          restore-keys: |
            ironhide-baseline-main-
      - uses: ironhide-ai/ironhide-scan@v2.4.1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini-2025-04-14
        with:
          api_key: ${{ secrets.IRONHIDE_API_KEY }}
          agent_id: agt_71bd63
          adapter: ironhide_openai_adapter:agent
          cli_sha256: ${{ vars.IRONHIDE_CLI_SHA256 }}
          advisory_mode: "false"
          block_on: critical,high
          profile: pr
          runs: 1

  monitor:
    name: ironhide/monitor
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "openai==2.28.0"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ironhide
          key: ironhide-baseline-main-${{ github.run_id }}
          restore-keys: |
            ironhide-baseline-main-
      - uses: ironhide-ai/ironhide-scan@v2.4.1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini-2025-04-14
        with:
          api_key: ${{ secrets.IRONHIDE_API_KEY }}
          agent_id: agt_71bd63
          adapter: ironhide_openai_adapter:agent
          cli_sha256: ${{ vars.IRONHIDE_CLI_SHA256 }}
          advisory_mode: "true"
          comment: "false"
          profile: pr
          runs: 1
